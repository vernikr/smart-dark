<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Dark by body class</title>
<style>
html{background:#0d0d0d}
body{font:16px/1.6 system-ui,sans-serif;margin:0;background:#0d0d0d;color:#f1f1f1}
body.dark{background:#0f0f0f;color:#f1f1f1}
main{max-width:640px;margin:80px auto;padding:0 24px}
.card{background:#1c1c1c;border:1px solid #2f2f2f;border-radius:8px;padding:16px;margin-top:24px}
</style>
</head><body class="dark"><main><h1>Themed through a class on the body</h1><p>Dark canvas announced by <code>body.dark</code>.</p><div class="card">Card body</div></main></body></html>
