<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gmail message</title>
  <style>
    html, body { min-height: 100%; background: #fff; color: #202124; }
    body { margin: 0; font: 14px Arial, sans-serif; }
    header { height: 72px; display: flex; align-items: center; padding: 0 28px; background: #fff; }
    input[aria-label="Search mail"] { width: 560px; height: 44px; border: 1px solid transparent; border-radius: 22px; padding: 0 18px; background: #f1f3f4; color: #202124; transition: background-color .18s ease, color .18s ease; }
    input[aria-label="Search mail"]:focus { outline: none; background: #fff !important; color: #202124 !important; border-color: #d2e3fc; box-shadow: 0 1px 4px #0002; }
    main { max-width: 980px; margin: 24px auto; background: #fff; }
    .message { border: 1px solid #dadce0; border-radius: 12px; padding: 22px; background: #fff; }
    .message-body { color: #202124; }
    .banner { width: 100%; border-collapse: collapse; }
    .banner td { background-color: #f2f5f7 !important; color: #202124 !important; padding: 22px; }
    .banner .headline { font-size: 22px; font-weight: 600; }
    .banner .action { background-color: #e8f0fe; color: #174ea6; font-weight: 600; }
    .banner[style] td { }
  </style>
</head>
<body>
  <header><input type="text" aria-label="Search mail" placeholder="Search mail"></header>
  <main>
    <article class="message">
      <h2>Новый опрос!</h2>
      <p>Голос X5 &lt;opros@example.test&gt;</p>
      <div class="message-body">
        <table class="banner" role="presentation">
          <tr><td class="headline">Здравствуйте, новый опрос для вас!</td></tr>
          <tr><td class="action">500 баллов　 №1238 • 8 мин　 Пройти опрос</td></tr>
        </table>
      </div>
    </article>
  </main>
</body>
</html>
