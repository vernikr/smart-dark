<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cancel image conversion</title>
  <style>
    body { margin: 0; background: #fff; color: #14161a; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    img { display: block; width: 700px; max-width: 100%; height: 460px; object-fit: cover; }
  </style>
</head>
<body>
  <main>
    <h1>Cancel image conversion</h1>
    <img id="cancel-image" src="photo.jpg?delay=1800" alt="Delayed image">
  </main>
</body>
</html>
