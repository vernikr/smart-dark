<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Picture with sources</title>
  <style>
    body { margin: 0; background: #fff; color: #14161a; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 24px 96px; }
    picture img { width: 100%; height: auto; display: block; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Responsive picture</h1>
    <!-- The <source> wins over img src in a real browser, which used to leave the bright original on screen. -->
    <picture>
      <source srcset="banner.png" type="image/png" media="(min-width: 100px)">
      <img src="banner.png" sizes="(max-width: 760px) 100vw, 760px"
        style="filter: sepia(0.2) !important"
        alt="Banner in a picture element" data-picture="1">
    </picture>
  </main>
</body>
</html>
