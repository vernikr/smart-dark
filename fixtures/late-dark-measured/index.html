<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Measured dark theme that arrives late</title>
  <style>
    body { margin: 0; font: 16px/1.6 system-ui, sans-serif; background: #fff; color: #202124; }
    main { padding: 48px 24px; }
    .row { padding: 12px 0; border-bottom: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <main>
    <div class="row">Skeleton row</div>
    <div class="row">Skeleton row</div>
    <div class="row">Skeleton row</div>
    <div class="row">Skeleton row</div>
    <div class="row">Skeleton row</div>
  </main>
  <script>
    // 900 ms: the surface is painted dark through inline styles only — no class, no attribute, nothing declared.
    // The only way to know this site is dark is to measure it again after it settles.
    setTimeout(() => {
      document.body.style.background = '#131314';
      document.body.style.color = '#e3e3e3';
      document.body.innerHTML = '<main>' + Array.from({ length: 14 }, (_, i) =>
        '<div class="row" style="background:#131314;color:#e3e3e3;border-color:#2c2c2e">Mail row ' + (i + 1) + '</div>').join('') + '</main>';
    }, 900);
  </script>
</body>
</html>
