<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dark widget scheme on a light page</title>
  <style>
    html { color-scheme: dark; background: #fff; color: #171717; }
    body { margin: 0; background: #fff; color: #171717; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 640px; margin: 80px auto; padding: 0 24px; }
  </style>
</head>
<body><main><h1>Light page with dark native controls</h1><p>The painted document remains light.</p></main></body>
</html>
